<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>门下 · 已迁址</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  // 原样转发 query 与 hash —— 深链的全部信息都在这两处（?pr= / &path= / &line= / #L12）
  location.replace('https://menxia-reader.github.io/menxia/' + location.search + location.hash);
</script>
<!-- 无 JS 兜底：meta refresh 带不上 query/hash，只到首页 -->
<meta http-equiv="refresh" content="1; url=https://menxia-reader.github.io/menxia/">
<style>
  html { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:16px/1.7 -apple-system,"PingFang SC",system-ui,sans-serif; }
  .box { text-align:center; padding:2rem; max-width:34rem; }
  a { color:#a8332a; }
</style>
</head>
<body>
<div class="box">
  <h1>门下已迁址</h1>
  <p><a id="link" href="https://menxia-reader.github.io/menxia/">https://menxia-reader.github.io/menxia/</a></p>
  <p style="font-size:.85em;opacity:.6">2026-10-19 迁到独立 org 域名（origin 隔离，钥匙不再与同域其他页面共享）。旧链接永久转发。</p>
</div>
<script>
  var a = document.getElementById('link');
  a.href = 'https://menxia-reader.github.io/menxia/' + location.search + location.hash;
  a.textContent = a.href;
</script>
</body>
</html>
